name: issue-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Apply keyword-based labels
        id: labels
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          TEXT=$(printf '%s\n%s' "$ISSUE_TITLE" "$ISSUE_BODY" | tr '[:upper:]' '[:lower:]')
          LABELS=""

          if echo "$TEXT" | grep -qiE '(error|bug|crash|broken|not working|fix|fail|falla)'; then
            LABELS="$LABELS bug"
          fi

          if echo "$TEXT" | grep -qiE '(feature|add|enhance|improve|new|request|want|mejora)'; then
            LABELS="$LABELS enhancement"
          fi

          if echo "$TEXT" | grep -qiE '(how|why|what|question|can i|help|como|ayuda)'; then
            LABELS="$LABELS question"
          fi

          if echo "$TEXT" | grep -qiE '(docs|readme|documentation|typo)'; then
            LABELS="$LABELS documentation"
          fi

          LABELS=$(echo "$LABELS" | sed 's/^ //')

          if [ -n "$LABELS" ]; then
            echo "labels=$LABELS" >> "$GITHUB_OUTPUT"
            gh issue edit "$ISSUE_NUMBER" --add-label "$LABELS"
          else
            echo "labels=none" >> "$GITHUB_OUTPUT"
            echo "No matching labels; skipping label assignment."
          fi

      - name: Format issue body preserving original text
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          SECTION=$(cat <<TRIAGE
          ## Triage

          **Labels applied:** ${LABELS:-none}

          **Category:** ${LABELS:-Not classified by keywords.}

          ### For reviewers
          - **Affected files:** game.js / index.html / README.md (not provided)
          - **Steps to reproduce:** Not provided.
          - **Expected behavior:** Not provided.
          - **Environment:** Not provided.

          ---
          *This section was added automatically by the issue-triage workflow. The original description above is preserved verbatim.*
          TRIAGE
          )
          printf '%s\n\n---\n\n%s\n' "$ISSUE_BODY" "$SECTION" > /tmp/issue-formatted.md
          gh issue edit "$ISSUE_NUMBER" --body-file /tmp/issue-formatted.md

      - name: Post triage comment
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ steps.labels.outputs.labels }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file - <<EOF
          **Triage summary**

          **Issue:** $ISSUE_TITLE
          **Labels applied:** ${LABELS:-none}

          For the full triage details including reviewer checklist, see the formatted issue body.
          EOF

      - name: Assign issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-assignee jisanchezp