name: issue-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Triage issue with opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            { "model": "opencode/big-pickle", "small_model": "opencode/big-pickle" }
        with:
          model: opencode/big-pickle
          prompt: |
            Triage this newly opened issue.

            Requirements:
            - PRESERVE the author's original text VERBATIM. Never edit, rephrase, or remove it.
            - Append a "## Triage" section (in English) after the original text containing:
              - a one-line summary for reviewers,
              - the detected category,
              - affected files (game.js / index.html / README.md),
              - steps to reproduce,
              - expected behavior,
              - environment.
              Use "Not provided." for anything that is unclear or missing.
            - Add labels to the issue from the repo's existing set (bug, enhancement,
              question, documentation) based on the content.
            - Post a comment with a short triage summary.
            - Do NOT change the issue state. Leave it open.

      - name: Assign issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ['jisanchezp']
            })